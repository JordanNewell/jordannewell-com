name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# One deploy at a time per branch; a newer push supersedes the in-flight deploy.
# main -> jordannewell-com.pages.dev (production); dev -> dev.jordannewell-com.pages.dev (design playground).
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mapped through env: secrets can't be tested directly in step if-conditions.
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        # Homepage bakes the pushed commit SHA at build time (git rev-parse
        # in index.astro) — checkout's default HEAD is exactly that commit.

      - name: Generate .md mirrors for LLM citations
        run: bash scripts/generate-md-mirrors.sh

      - name: Ensure Pages project exists
        if: env.HAS_CF_TOKEN == 'true'
        run: |
          npx wrangler pages project list | grep -q "jordannewell-com" \
            || npx wrangler pages project create jordannewell-com --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF_TOKEN == 'true'
        run: npx wrangler pages deploy dist --project-name=jordannewell-com --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 554619f8c7d3a4010cb161df3037269d

      - name: Smoke-check the deployment
        if: env.HAS_CF_TOKEN == 'true'
        # main serves the production alias; any other branch gets <branch>.<project>.pages.dev.
        # Branch previews sit behind Cloudflare Access — curl gets a 302 to the
        # login, which means the deployment is serving. Only 200 proves content
        # on the ungated production alias.
        run: |
          sleep 20
          if [ "${{ github.ref_name }}" = "main" ]; then
            base="https://jordannewell-com.pages.dev"
            ok_codes="200"
          else
            base="https://${{ github.ref_name }}.jordannewell-com.pages.dev"
            ok_codes="200 302"
          fi
          for path in / /posts/ /llms.txt /rss.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${path}")
            echo "${path} -> ${code}"
            echo "$ok_codes" | grep -qw "$code" || { echo "FAIL: ${path} not in [$ok_codes]"; exit 1; }
          done

      - name: No token yet — skip deploy
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN secret is not set — build verified, deploy skipped. Add the secret (Cloudflare token with Pages: Edit) and re-run this workflow."
