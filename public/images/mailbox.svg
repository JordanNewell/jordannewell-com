<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 270" fill="none">
  <!-- letter tail sticking out (drawn behind the box) -->
  <g transform="rotate(-8 208 110)">
    <rect x="182" y="92" width="42" height="36" rx="3" fill="#FEFDF7" stroke="#191713" stroke-width="4"/>
    <path d="M182 94 L204 112 L224 94" stroke="#191713" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- front face shading -->
  <path d="M150 62 H158 Q192 62 192 96 V150 H150 Z" fill="#CE843A"/>

  <!-- box -->
  <path d="M28 150 V96 Q28 62 62 62 H158 Q192 62 192 96 V150 Z"
        fill="#E39440" stroke="#191713" stroke-width="6" stroke-linejoin="round"/>
  <path d="M150 62 V150" stroke="#191713" stroke-width="4"/>

  <!-- door -->
  <rect x="157" y="100" width="27" height="42" rx="5" fill="#A36B2D" stroke="#191713" stroke-width="4"/>
  <circle cx="163" cy="121" r="2.5" fill="#191713"/>

  <!-- flag up -->
  <rect x="52" y="26" width="8" height="44" fill="#191713"/>
  <path d="M60 28 H94 Q100 28 100 34 V46 Q100 52 94 52 H60 Z"
        fill="#86ED2E" stroke="#191713" stroke-width="4" stroke-linejoin="round"/>

  <!-- post -->
  <rect x="96" y="150" width="20" height="100" fill="#8C551C" stroke="#191713" stroke-width="5"/>

  <!-- ground + grass -->
  <path d="M38 254 Q75 247 115 253 Q150 258 188 252" stroke="#191713" stroke-width="5" stroke-linecap="round"/>
  <path d="M60 252 Q58 242 54 238 M66 252 Q67 244 71 240" stroke="#191713" stroke-width="4" stroke-linecap="round"/>
  <path d="M146 254 Q148 245 152 241" stroke="#191713" stroke-width="4" stroke-linecap="round"/>
</svg>
