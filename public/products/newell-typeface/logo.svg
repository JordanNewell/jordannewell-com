<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" role="img" aria-label="NEWELL N mark">
  <!--
    NEWELL N logo — green variant for accent contexts (against black backgrounds).
    Same construction as newell-n.svg, color swapped to brand primary #00FF41.
    Use sparingly — the white version on dark is the canonical lockup.
  -->
  <line x1="20" y1="20" x2="20" y2="100" stroke="#00FF41" stroke-width="12" stroke-linecap="round"/>
  <line x1="80" y1="20" x2="80" y2="100" stroke="#00FF41" stroke-width="12" stroke-linecap="round"/>
  <line x1="20" y1="20" x2="80" y2="100" stroke="#00FF41" stroke-width="12" stroke-linecap="round"/>
</svg>
